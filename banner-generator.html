<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Banner Generator · Mitchell</title>
  <meta name="description" content="Compose a GitHub profile banner from live stats, pick a palette and export it as PNG at three sizes.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237c8cf8'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='900' font-size='18' fill='white' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/lab.css">
  <style>
    .layout { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(280px, .6fr); gap: 16px; align-items: start; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
    .preview { padding: 18px; }
    .preview canvas { width: 100%; border-radius: 14px; box-shadow: var(--shadow); }
    .controls { display: flex; flex-direction: column; gap: 14px; }
    .check { display: flex; align-items: center; gap: 10px; font-size: 14px; }
    .check input { accent-color: var(--primary); width: 16px; height: 16px; }
    .sizes { display: flex; gap: 8px; flex-wrap: wrap; }
  </style>
</head>
<body>
<div class="wrap">
  <nav id="lab-nav" aria-label="Lab navigation"></nav>

  <header class="page-head rise">
    <p class="eyebrow">banner-generator</p>
    <h1>Banner <span class="grad">generator</span></h1>
    <p>Compose a banner from live profile stats. What you see is what you download: the preview and the export share one drawing routine.</p>
  </header>

  <div class="layout">
    <section class="card rise d1">
      <div class="preview"><canvas id="banner" aria-label="Banner preview"></canvas></div>
      <div class="card-body" style="padding-top: 0;">
        <p class="eyebrow">Download</p>
        <div class="sizes">
          <button class="btn" data-size="1200x400">1200 × 400</button>
          <button class="btn ghost" data-size="1500x500">1500 × 500</button>
          <button class="btn ghost" data-size="1920x640">1920 × 640</button>
        </div>
      </div>
    </section>

    <aside class="card rise d2">
      <div class="card-body controls">
        <div class="field"><label for="name">Name</label><input class="input" id="name" value="Mitchell"></div>
        <div class="field"><label for="tagline">Tagline</label><input class="input" id="tagline" value="Software Engineer · London"></div>
        <div class="field"><label for="palette">Palette</label>
          <select class="select" id="palette">
            <option value="indigo" selected>Indigo Night</option>
            <option value="ocean">Ocean</option>
            <option value="ember">Ember</option>
            <option value="emerald">Emerald</option>
            <option value="mono">Monochrome</option>
          </select></div>
        <div class="field"><label>Elements</label>
          <label class="check"><input type="checkbox" id="showStats" checked> Live stat chips</label>
          <label class="check"><input type="checkbox" id="showChart" checked> Market line art</label>
          <label class="check"><input type="checkbox" id="showGrid" checked> Grid texture</label>
          <label class="check"><input type="checkbox" id="showHandle" checked> GitHub handle</label>
        </div>
        <p class="note" id="statsNote"></p>
      </div>
    </aside>
  </div>

  <footer id="lab-footer"></footer>
</div>

<script src="assets/js/lab.js"></script>
<script>
(async function () {
  Lab.nav('banner-generator.html');
  const profile = await Lab.load();
  Lab.footer(profile);
  const cal = profile.calendar;

  const PALETTES = {
    indigo: { bg: ['#0b1020', '#141a3a', '#2a1650'], orbs: ['#6e7ff3', '#a78bfa', '#f472b6'], line: ['#7c8cf8', '#c4b5fd', '#f472b6'], up: '#3fb950', down: '#f472b6' },
    ocean: { bg: ['#061423', '#0b2a44', '#0e4a6b'], orbs: ['#38bdf8', '#2dd4bf', '#818cf8'], line: ['#38bdf8', '#a5f3fc', '#2dd4bf'], up: '#34d399', down: '#fb7185' },
    ember: { bg: ['#1a0b0b', '#3b1010', '#5a1e0f'], orbs: ['#f97316', '#ef4444', '#fbbf24'], line: ['#fb923c', '#fde68a', '#f43f5e'], up: '#fbbf24', down: '#f43f5e' },
    emerald: { bg: ['#06130f', '#0b2a22', '#0f4034'], orbs: ['#34d399', '#22d3ee', '#a3e635'], line: ['#34d399', '#a7f3d0', '#22d3ee'], up: '#a3e635', down: '#fb7185' },
    mono: { bg: ['#0a0a0a', '#171717', '#262626'], orbs: ['#737373', '#a3a3a3', '#525252'], line: ['#a3a3a3', '#f5f5f5', '#d4d4d4'], up: '#e5e5e5', down: '#737373' },
  };

  const inputs = {
    name: document.getElementById('name'), tagline: document.getElementById('tagline'), palette: document.getElementById('palette'),
    showStats: document.getElementById('showStats'), showChart: document.getElementById('showChart'), showGrid: document.getElementById('showGrid'), showHandle: document.getElementById('showHandle'),
  };
  inputs.name.value = profile.user.name || 'Mitchell';
  inputs.tagline.value = `${(profile.config && profile.config.title) || 'Software Engineer'} · ${profile.user.location || 'London'}`;

  const chips = [
    `${Lab.fmt(cal.total)} contributions · last 12 months`,
    `${cal.activeDays} active days`,
    `${cal.longestStreak}-day longest streak`,
    `${profile.totals.publicRepos} public repos`,
  ];
  document.getElementById('statsNote').textContent = profile.demo ? 'Demo data: the live snapshot could not be loaded.' : `Stats from the snapshot generated ${Lab.longDate(profile.generatedAt.slice(0, 10))}.`;

  function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const font = getComputedStyle(document.body).fontFamily;
  const mono = getComputedStyle(document.documentElement).getPropertyValue('--mono');

  function drawBanner(ctx, W, H) {
    const p = PALETTES[inputs.palette.value];
    const u = H / 400; // scale unit relative to the 1200x400 reference
    ctx.clearRect(0, 0, W, H);
    // Background
    const bg = ctx.createLinearGradient(0, 0, W, H); p.bg.forEach((c, i) => bg.addColorStop(i / (p.bg.length - 1), c));
    roundRect(ctx, 0, 0, W, H, 24 * u); ctx.fillStyle = bg; ctx.fill();
    ctx.save(); roundRect(ctx, 0, 0, W, H, 24 * u); ctx.clip();
    if (inputs.showGrid.checked) {
      ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 1;
      for (let x = 0; x < W; x += 40 * u) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
      for (let y = 0; y < H; y += 40 * u) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    }
    // Orbs
    [[0.15, 0.2, 0.55, p.orbs[0]], [0.8, 0.95, 0.5, p.orbs[1]], [0.95, 0.1, 0.45, p.orbs[2]]].forEach(([fx, fy, a, col]) => {
      const g = ctx.createRadialGradient(W * fx, H * fy, 0, W * fx, H * fy, H * 0.85);
      g.addColorStop(0, hexA(col, a)); g.addColorStop(1, hexA(col, 0));
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    });
    // Market art
    if (inputs.showChart.checked) {
      const r = rng(917), x0 = W * 0.58, x1 = W * 0.96, yTop = H * 0.16, yBot = H * 0.84, n = 26, step = (x1 - x0) / n;
      let price = 0.7; const pts = [];
      const y = (v) => yTop + (1 - v) * (yBot - yTop);
      for (let i = 0; i < n; i++) {
        const open = price, close = Math.min(0.98, Math.max(0.05, price + 0.018 + (r() - 0.5) * 0.12));
        const hi = Math.min(1, Math.max(open, close) + r() * 0.05), lo = Math.max(0, Math.min(open, close) - r() * 0.05);
        const cx = x0 + i * step + step / 2, up = close >= open, col = up ? p.up : p.down;
        ctx.strokeStyle = hexA(col, 0.3); ctx.lineWidth = Math.max(1, u); ctx.beginPath(); ctx.moveTo(cx, y(hi)); ctx.lineTo(cx, y(lo)); ctx.stroke();
        ctx.fillStyle = hexA(col, 0.3); ctx.fillRect(cx - step * 0.28, y(Math.max(open, close)), step * 0.56, Math.max(1.5 * u, Math.abs(y(open) - y(close))));
        pts.push([cx, y((open + close) / 2 + 0.04)]); price = close;
      }
      const lg = ctx.createLinearGradient(x0, 0, x1, 0); p.line.forEach((c, i) => lg.addColorStop(i / (p.line.length - 1), c));
      ctx.beginPath(); pts.forEach(([x, yy], i) => (i ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy)));
      ctx.lineTo(pts[pts.length - 1][0], yBot); ctx.lineTo(pts[0][0], yBot); ctx.closePath();
      const ag = ctx.createLinearGradient(0, yTop, 0, yBot); ag.addColorStop(0, hexA(p.line[1], 0.28)); ag.addColorStop(1, hexA(p.line[1], 0));
      ctx.fillStyle = ag; ctx.fill();
      ctx.beginPath(); pts.forEach(([x, yy], i) => (i ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy)));
      ctx.strokeStyle = lg; ctx.lineWidth = 3 * u; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();
      const [ex, ey] = pts[pts.length - 1];
      ctx.beginPath(); ctx.arc(ex, ey, 6 * u, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
      ctx.beginPath(); ctx.arc(ex, ey, 12 * u, 0, Math.PI * 2); ctx.strokeStyle = hexA(p.line[2], 0.6); ctx.lineWidth = 2 * u; ctx.stroke();
    }
    // Text
    const left = W * 0.055;
    ctx.fillStyle = '#fff'; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
    ctx.font = `800 ${76 * u}px ${font}`; ctx.fillText(inputs.name.value || 'Mitchell', left, H * 0.36);
    ctx.font = `500 ${26 * u}px ${font}`; ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fillText(inputs.tagline.value, left, H * 0.47);
    if (inputs.showStats.checked) {
      let cx = left; const cy = H * 0.62, ch = 40 * u;
      ctx.font = `600 ${16 * u}px ${font}`;
      for (const label of chips) {
        const w = ctx.measureText(label).width + 30 * u;
        if (cx + w > W * (inputs.showChart.checked ? 0.56 : 0.95) && cx > left) break;
        roundRect(ctx, cx, cy, w, ch, ch / 2); ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = u; ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.95)'; ctx.textBaseline = 'middle'; ctx.fillText(label, cx + 15 * u, cy + ch / 2 + u);
        ctx.textBaseline = 'alphabetic';
        cx += w + 12 * u;
      }
    }
    if (inputs.showHandle.checked) {
      ctx.font = `500 ${16 * u}px ${mono}`; ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.textAlign = 'right';
      ctx.fillText(`github.com/${profile.user.login}`, W - left, H * 0.9);
    }
    ctx.restore();
    roundRect(ctx, 0.5, 0.5, W - 1, H - 1, 24 * u); ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.lineWidth = 1; ctx.stroke();
  }
  function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; }

  const canvas = document.getElementById('banner');
  function preview() {
    const w = canvas.parentElement.clientWidth - 36, h = Math.round(w / 3);
    const ctx = Lab.hidpi(canvas, w, h);
    drawBanner(ctx, w, h);
  }
  Object.values(inputs).forEach((el) => el.addEventListener('input', preview));
  new ResizeObserver(preview).observe(canvas.parentElement);
  document.querySelectorAll('[data-size]').forEach((b) => b.addEventListener('click', () => {
    const [w, h] = b.dataset.size.split('x').map(Number);
    const off = document.createElement('canvas'); off.width = w; off.height = h;
    drawBanner(off.getContext('2d'), w, h);
    Lab.download(off, `github-banner-${w}x${h}.png`);
  }));
  preview();
})();
</script>
</body>
</html>
