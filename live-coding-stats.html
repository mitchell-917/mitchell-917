<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terminal Dashboard · Mitchell</title>
  <meta name="description" content="A typed-out terminal session streaming Mitchell's real GitHub streaks, weekday patterns and language splits.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237c8cf8'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='900' font-size='18' fill='white' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/lab.css">
  <style>
    .term { font-family: var(--mono); font-size: 13.5px; line-height: 1.65; }
    .term-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border-soft); background: var(--card-2); }
    .term-head i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .term-head .title { margin-left: 8px; font-size: 12.5px; color: var(--muted); font-family: var(--mono); }
    .term-body { padding: 18px 20px 22px; min-height: 420px; white-space: pre-wrap; word-break: break-word; }
    .line { display: block; min-height: 1.65em; }
    .prompt { color: var(--success); font-weight: 700; }
    .path { color: var(--primary); font-weight: 700; }
    .cmd { color: var(--text); }
    .ok::before { content: '✓ '; color: var(--success); }
    .info::before { content: '→ '; color: var(--primary); }
    .dim { color: var(--faint); }
    .k { color: var(--muted); display: inline-block; min-width: 12ch; }
    .bar { letter-spacing: -1px; }
    .cursor { display: inline-block; width: 9px; height: 1.1em; background: var(--primary); vertical-align: text-bottom; animation: blink 1s steps(2) infinite; margin-left: 2px; }
    @keyframes blink { to { visibility: hidden; } }
    .val { color: var(--text); font-weight: 700; }
    .warn { color: var(--amber); }
  </style>
</head>
<body>
<div class="wrap">
  <nav id="lab-nav" aria-label="Lab navigation"></nav>

  <header class="page-head rise">
    <p class="eyebrow">live-coding-stats</p>
    <h1>Terminal <span class="grad">dashboard</span></h1>
    <p>A shell session that types itself. Every number comes from the profile snapshot this repository regenerates daily, so what scrolls past is real.</p>
  </header>

  <div class="toolbar rise d1" style="margin-bottom: 14px;">
    <button class="btn" id="replay">Replay</button>
    <button class="btn ghost" id="skip">Skip animation</button>
    <button class="btn ghost" id="copy">Copy as text</button>
    <span class="note" id="status"></span>
  </div>

  <section class="card rise d2">
    <div class="term-head"><i style="background:#ff5f56"></i><i style="background:#ffbd2e"></i><i style="background:#27c93f"></i><span class="title" id="title">mitchell@github: ~/profile — zsh</span></div>
    <div class="term-body term" id="term" aria-live="polite"></div>
  </section>

  <footer id="lab-footer"></footer>
</div>

<script src="assets/js/lab.js"></script>
<script>
(async function () {
  Lab.nav('live-coding-stats.html');
  const profile = await Lab.load();
  Lab.footer(profile);
  const term = document.getElementById('term');
  const status = document.getElementById('status');
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const bar = (frac, width = 22) => { const n = Math.round(Math.max(0, Math.min(1, frac)) * width); return `<span class="bar">${'█'.repeat(n)}<span class="dim">${'░'.repeat(width - n)}</span></span>`; };

  const cal = profile.calendar, user = profile.user, totals = profile.totals;
  const pct = cal.days.length ? Math.round((cal.activeDays / cal.days.length) * 100) : 0;
  const weekdayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const wd = [1, 2, 3, 4, 5, 6, 0].map((i) => ({ name: weekdayNames[i], count: cal.byWeekday[i] || 0 }));
  const wdMax = Math.max(1, ...wd.map((d) => d.count));
  const months = (cal.monthly || []).slice(-12);
  const mMax = Math.max(1, ...months.map((m) => m.count));
  const langs = (profile.languages || []).slice(0, 6);
  const repos = (profile.repos || []).filter((r) => !r.fork).slice(0, 6);

  const script = [
    { cmd: 'profile --summary', out: [
      `<span class="ok"><span class="val">${Lab.fmt(cal.total)}</span> contributions in the last 12 months · <span class="val">${cal.activeDays}</span> active days (${pct}%)</span>`,
      `<span class="ok">current streak <span class="val">${cal.currentStreak}</span> days · longest <span class="val">${cal.longestStreak}</span> days${cal.longestStreakEnd ? ` (ended ${Lab.longDate(cal.longestStreakEnd)})` : ''}</span>`,
      cal.busiest ? `<span class="ok">busiest day <span class="val">${Lab.longDate(cal.busiest.date)}</span> with <span class="val">${Lab.fmt(cal.busiest.count)}</span> contributions</span>` : '',
      `<span class="ok"><span class="val">${totals.publicRepos}</span> public repositories · <span class="val">${totals.stars}</span> stars earned · <span class="val">${user.followers}</span> followers</span>`,
    ].filter(Boolean) },
    { cmd: 'activity --by-weekday', out: wd.map((d) => `<span class="k">${d.name}</span>${bar(d.count / wdMax)}  <span class="dim">${Lab.fmt(d.count)}</span>`) },
    { cmd: 'activity --by-month', out: months.map((m) => `<span class="k">${Lab.MONTHS[+m.month.slice(5, 7) - 1]} ${m.month.slice(2, 4)}</span>${bar(m.count / mMax)}  <span class="dim">${Lab.fmt(m.count)}</span>`) },
    { cmd: 'languages --public --by-bytes', out: langs.length ? langs.map((l) => `<span class="k">${esc(l.name)}</span><span style="color:${l.color}">${bar(l.percent / 100)}</span>  <span class="dim">${l.percent.toFixed(l.percent < 1 ? 2 : 1)}%</span>`) : ['<span class="warn">no language data in snapshot</span>'] },
    { cmd: 'repos --sort=updated --top=6', out: repos.length ? repos.map((r) => `<span class="k">★ ${r.stars}</span><span class="val">${esc(r.name)}</span> <span class="dim">${r.language ? '· ' + esc(r.language) : ''} · pushed ${r.pushedAt ? Lab.longDate(r.pushedAt.slice(0, 10)) : 'n/a'}</span>`) : ['<span class="warn">no repository data in snapshot</span>'] },
    { cmd: 'status', out: [
      `<span class="info">snapshot generated ${Lab.longDate(profile.generatedAt.slice(0, 10))}${profile.demo ? ' <span class="warn">(demo data: snapshot not reachable)</span>' : ' by GitHub Actions'}</span>`,
      `<span class="info">the profile README renders its SVGs from this same file</span>`,
      `<span class="info">source: <a href="https://github.com/mitchell-917/mitchell-917">github.com/mitchell-917/mitchell-917</a></span>`,
    ] },
  ];

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  let run = 0;
  let plain = [];

  function promptHtml() { return `<span class="prompt">mitchell@github</span> <span class="path">~/profile</span> <span class="dim">$</span> `; }
  function addLine(html) { const el = document.createElement('span'); el.className = 'line'; el.innerHTML = html; term.appendChild(el); return el; }

  async function play(instant = false) {
    const id = ++run;
    term.innerHTML = '';
    plain = [];
    status.textContent = instant ? '' : 'typing…';
    for (const block of script) {
      if (id !== run) return;
      const line = addLine(promptHtml());
      plain.push(`$ ${block.cmd}`);
      if (instant) line.innerHTML += `<span class="cmd">${esc(block.cmd)}</span>`;
      else {
        const cursor = '<span class="cursor"></span>';
        let typed = '';
        for (const ch of block.cmd) {
          if (id !== run) return;
          typed += ch;
          line.innerHTML = promptHtml() + `<span class="cmd">${esc(typed)}</span>` + cursor;
          await sleep(28 + Math.random() * 40);
        }
        line.innerHTML = promptHtml() + `<span class="cmd">${esc(typed)}</span>`;
        await sleep(220);
      }
      for (const out of block.out) {
        if (id !== run) return;
        addLine(out);
        plain.push(out.replace(/<[^>]+>/g, ''));
        if (!instant) await sleep(70);
      }
      addLine('');
      plain.push('');
      if (!instant) await sleep(320);
    }
    if (id !== run) return;
    addLine(promptHtml() + '<span class="cursor"></span>');
    status.textContent = '';
  }

  document.getElementById('replay').addEventListener('click', () => play(false));
  document.getElementById('skip').addEventListener('click', () => play(true));
  document.getElementById('copy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(plain.join('\n')); Lab.toast('Copied session to clipboard'); } catch { Lab.toast('Clipboard unavailable'); }
  });
  play(false);
})();
</script>
</body>
</html>
