<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Carousel · Mitchell</title>
  <meta name="description" content="Mitchell's featured repositories in a 3D carousel with live stars, languages and demo links.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237c8cf8'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='900' font-size='18' fill='white' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/lab.css">
  <style>
    .scene { perspective: 1400px; height: 420px; position: relative; margin: 8px 0 12px; user-select: none; }
    .ring { position: absolute; inset: 0; transform-style: preserve-3d; }
    .pcard { position: absolute; left: 50%; top: 50%; width: min(520px, 86vw); transform-style: preserve-3d; transition: transform .7s cubic-bezier(.2,.7,.2,1), opacity .7s ease, filter .7s ease; cursor: pointer; }
    .pcard .card { --tint: var(--primary); }
    .pcard .card::before { background: linear-gradient(90deg, var(--tint), color-mix(in srgb, var(--tint) 30%, transparent)); }
    .pcard.active { cursor: default; }
    .pcard .card-body { padding: 24px; display: flex; flex-direction: column; gap: 14px; }
    .phead { display: flex; gap: 14px; align-items: center; }
    .picon { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: color-mix(in srgb, var(--tint) 16%, transparent); color: var(--tint); flex: none; }
    .ptitle { margin: 0; font-size: 20px; letter-spacing: -.3px; }
    .prepo { font-family: var(--mono); font-size: 12px; color: var(--muted); }
    .pdesc { margin: 0; color: var(--muted); font-size: 14px; min-height: 3.2em; }
    .ptags { display: flex; flex-wrap: wrap; gap: 6px; }
    .pmeta { display: flex; gap: 14px; align-items: center; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
    .pmeta .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: -1px; }
    .plinks { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
    .controls { display: flex; justify-content: center; align-items: center; gap: 10px; }
    .dots { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
    .dots button { width: 10px; height: 10px; border-radius: 50%; border: 0; background: var(--border); cursor: pointer; padding: 0; transition: transform .2s, background .2s; }
    .dots button[aria-current="true"] { background: var(--primary); transform: scale(1.3); }
    .repo-list { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    .repo { padding: 14px 16px; border: 1px solid var(--border-soft); border-radius: 12px; background: var(--card-2); display: flex; flex-direction: column; gap: 6px; color: inherit; transition: border-color .2s; }
    .repo:hover { border-color: var(--primary); text-decoration: none; }
    .repo b { font-size: 14.5px; }
    .repo p { margin: 0; color: var(--muted); font-size: 13px; flex: 1; }
    .repo .meta { font-size: 12px; color: var(--faint); display: flex; gap: 12px; }
    @media (max-width: 700px) { .scene { height: 470px; } }
  </style>
</head>
<body>
<div class="wrap">
  <nav id="lab-nav" aria-label="Lab navigation"></nav>

  <header class="page-head rise">
    <p class="eyebrow">project-showcase</p>
    <h1>Featured <span class="grad">projects</span></h1>
    <p>The repositories I would show first, with stars and languages read live from the profile snapshot. Use the arrows, the keyboard, or swipe.</p>
  </header>

  <section class="rise d1">
    <div class="scene" id="scene"><div class="ring" id="ring"></div></div>
    <div class="controls">
      <button class="btn ghost" id="prev" aria-label="Previous project">←</button>
      <button class="btn ghost" id="auto">Pause autoplay</button>
      <button class="btn ghost" id="next" aria-label="Next project">→</button>
    </div>
    <div class="dots" id="dots"></div>
  </section>

  <section class="rise d2" style="margin-top: 36px;">
    <p class="eyebrow">All public repositories</p>
    <div class="repo-list" id="repos"></div>
  </section>

  <footer id="lab-footer"></footer>
</div>

<script src="assets/js/lab.js"></script>
<script>
(async function () {
  Lab.nav('project-showcase.html');
  const profile = await Lab.load();
  Lab.footer(profile);
  const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  const GLYPHS = {
    chart: '<svg width="26" height="26" viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 30 17 21l6 5 8-13 5 4"/><circle cx="36" cy="17" r="2.6" fill="currentColor" stroke="none"/></svg>',
    code: '<svg width="26" height="26" viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 14 8 22l8 8M28 14l8 8-8 8M25 12l-6 20"/></svg>',
    bars: '<svg width="26" height="26" viewBox="0 0 44 44" fill="currentColor"><rect x="9" y="24" width="5" height="10" rx="1.5"/><rect x="17" y="16" width="5" height="18" rx="1.5"/><rect x="25" y="20" width="5" height="14" rx="1.5"/><rect x="33" y="10" width="5" height="24" rx="1.5"/></svg>',
    spark: '<svg width="26" height="26" viewBox="0 0 44 44" fill="currentColor"><path d="M22 8l3.5 10.5L36 22l-10.5 3.5L22 36l-3.5-10.5L8 22l10.5-3.5z"/></svg>',
    lock: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.5" fill="currentColor" stroke="none"/></svg>',
  };
  const langColor = (name) => (profile.languages.find((l) => l.name === name) || {}).color || 'var(--muted)';

  const cards = (profile.projects || []).map((p) => ({
    title: p.title, repo: `${profile.user.login}/${p.repo}`, description: p.description, tech: p.tech || [], stars: p.stars, language: p.language,
    pushedAt: p.pushedAt, url: p.url, demo: p.demo, icon: p.icon, tint: p.accent,
  }));
  if (profile.config && profile.config.privateWork) {
    cards.push({ title: profile.config.privateWork.title, repo: 'private · trading-systems', description: profile.config.privateWork.text, tech: ['MQL5', 'Pine Script', 'Python', 'GitHub Actions'], icon: 'lock', tint: '#f0b429', private: true });
  }
  if (!cards.length) cards.push({ title: 'No projects in snapshot', repo: '', description: 'The data snapshot could not be loaded.', tech: [], icon: 'spark', tint: '#7c8cf8' });

  const ring = document.getElementById('ring');
  const dots = document.getElementById('dots');
  let index = 0, autoplay = true, timer = 0;

  cards.forEach((c, i) => {
    const el = document.createElement('div'); el.className = 'pcard';
    el.innerHTML = `<div class="card" style="--tint:${c.tint}"><div class="card-body">
      <div class="phead"><div class="picon">${GLYPHS[c.icon] || GLYPHS.spark}</div><div><h3 class="ptitle">${esc(c.title)}</h3><div class="prepo">${esc(c.repo)}</div></div></div>
      <p class="pdesc">${esc(c.description)}</p>
      <div class="ptags">${c.tech.map((t) => `<span class="chip" style="color:${c.tint};background:color-mix(in srgb, ${c.tint} 14%, transparent);border-color:color-mix(in srgb, ${c.tint} 40%, transparent)">${esc(t)}</span>`).join('')}</div>
      <div class="pmeta">${c.private ? '<span>🔒 private repository</span>' : `<span>★ ${Lab.fmt(c.stars)}</span>${c.language ? `<span><i class="dot" style="background:${langColor(c.language)}"></i>${esc(c.language)}</span>` : ''}${c.pushedAt ? `<span>updated ${Lab.longDate(c.pushedAt.slice(0, 10))}</span>` : ''}`}</div>
      <div class="plinks">${c.url ? `<a class="btn small" href="${c.url}" rel="noopener">Repository</a>` : ''}${c.demo ? `<a class="btn small ghost" href="${c.demo}" rel="noopener">Live demo</a>` : ''}</div>
    </div></div>`;
    el.addEventListener('click', (e) => { if (!el.classList.contains('active')) { e.preventDefault(); go(i); } });
    ring.appendChild(el);
    const d = document.createElement('button'); d.setAttribute('aria-label', `Show ${c.title}`); d.addEventListener('click', () => go(i)); dots.appendChild(d);
  });

  function layout() {
    const els = [...ring.children], n = els.length, angle = 360 / n;
    const radius = Math.max(420, Math.min(720, ring.clientWidth * 0.62));
    els.forEach((el, i) => {
      let off = (i - index) % n; if (off > n / 2) off -= n; if (off < -n / 2) off += n;
      const active = off === 0;
      el.classList.toggle('active', active);
      el.style.transform = `translate(-50%, -50%) rotateY(${off * angle}deg) translateZ(${radius}px) rotateY(${-off * angle}deg) scale(${active ? 1 : 0.82})`;
      el.style.opacity = active ? 1 : Math.abs(off) === 1 ? 0.55 : 0.18;
      el.style.zIndex = active ? 10 : 10 - Math.abs(off);
      el.style.filter = active ? 'none' : 'blur(.6px)';
      el.style.pointerEvents = Math.abs(off) <= 1 ? 'auto' : 'none';
    });
    [...dots.children].forEach((d, i) => d.setAttribute('aria-current', String(i === index)));
  }
  function go(i) { index = (i + cards.length) % cards.length; layout(); restart(); }
  function restart() { clearInterval(timer); if (autoplay) timer = setInterval(() => go(index + 1), 6000); }

  document.getElementById('prev').addEventListener('click', () => go(index - 1));
  document.getElementById('next').addEventListener('click', () => go(index + 1));
  const autoBtn = document.getElementById('auto');
  autoBtn.addEventListener('click', () => { autoplay = !autoplay; autoBtn.textContent = autoplay ? 'Pause autoplay' : 'Resume autoplay'; restart(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') go(index - 1); if (e.key === 'ArrowRight') go(index + 1); });
  const scene = document.getElementById('scene');
  let startX = null;
  scene.addEventListener('pointerdown', (e) => { startX = e.clientX; });
  scene.addEventListener('pointerup', (e) => { if (startX == null) return; const dx = e.clientX - startX; startX = null; if (Math.abs(dx) > 50) go(index + (dx < 0 ? 1 : -1)); });
  scene.addEventListener('pointerenter', () => clearInterval(timer));
  scene.addEventListener('pointerleave', restart);
  new ResizeObserver(layout).observe(ring);

  // Public repositories list
  const list = document.getElementById('repos');
  const repos = (profile.repos || []).filter((r) => !r.fork);
  list.innerHTML = repos.length ? repos.map((r) => `<a class="repo" href="${r.url}" rel="noopener">
      <b>${esc(r.name)}</b><p>${esc(r.description || 'No description yet.')}</p>
      <span class="meta">${r.language ? `<span><i class="dot" style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${langColor(r.language)};margin-right:5px;vertical-align:-1px"></i>${esc(r.language)}</span>` : ''}<span>★ ${Lab.fmt(r.stars)}</span><span>updated ${Lab.longDate(r.pushedAt.slice(0, 10))}</span></span>
    </a>`).join('') : '<p class="note">Repository list unavailable in this snapshot.</p>';

  layout(); restart();
})();
</script>
</body>
</html>
